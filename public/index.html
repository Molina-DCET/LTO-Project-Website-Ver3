<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO Cabuyao District Office - Queuing System</title>
    <meta name="description" content="Land Transportation Office Cabuyao District Office Queuing System Homepage">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <a class="skip-nav" href="#main-content">Skip to main content</a>

    <!-- Header Section -->
    <header class="header">
        <div class="header-left">
            <img src="assets/img/logo.png" alt="LTO Logo" class="header-logo">
            <div class="header-title-container">
                <span class="header-title">LAND TRANSPORTATION OFFICE</span>
                <span class="header-subtitle">CABUYAO DISTRICT OFFICE</span>
            </div>
        </div>
        <div class="header-right">
            <div class="time-container">
                <span class="date-text" id="date-display">August 02, 2026</span>
                <span class="time-text" id="time-display">14:34:33</span>
            </div>
            <a href="login.html" class="admin-btn" id="admin-button">ADMIN</a>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="hero" id="main-content">
        <!-- Faint Watermark Logo in Background -->
        <img src="assets/img/logo.png" alt="LTO Logo Watermark" class="hero-watermark">
        
        <div class="hero-content">
            <h1 class="hero-title">QUEUING SYSTEM</h1>

            <!-- Live Queue Statistics Bar -->
            <div class="hero-stats-bar" aria-label="Live queue statistics">
                <div class="stat-card">
                    <span class="stat-label">Now Serving</span>
                    <span class="stat-value" id="stat-now-serving"
                          aria-live="polite" aria-atomic="true">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">In Queue</span>
                    <span class="stat-value" id="stat-in-queue"
                          aria-live="polite" aria-atomic="true">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Avg. Wait</span>
                    <span class="stat-value" id="stat-avg-wait"
                          aria-live="polite" aria-atomic="true">—</span>
                </div>
            </div>

            <!-- Link to viewQueuing.html which is standard for the project -->
            <a href="viewQueuing.html" class="view-queuing-btn" id="view-queuing-button">
                <img src="assets/img/people logo.png" alt="People Icon" class="people-icon">
                <span class="btn-label">VIEW QUEUING</span>
            </a>
        </div>
    </main>

    <!-- Live Philippine Standard Time Script -->
    <script src="js/api.js" defer></script>
    <script src="js/index.js" defer></script>
</body>
</html>
