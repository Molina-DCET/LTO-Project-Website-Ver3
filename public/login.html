<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO Cabuyao District Office - Admin Login</title>
    <meta name="description" content="Land Transportation Office Cabuyao District Office Queuing System Admin Login">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <a class="skip-nav" href="#main-content">Skip to main content</a>

    <!-- Header Section -->
    <header class="header">
        <div class="header-left">
            <img src="assets/img/logo.png" alt="LTO Logo" class="header-logo">
            <div class="header-title-container">
                <span class="header-title">LAND TRANSPORTATION OFFICE</span>
                <span class="header-subtitle">CABUYAO DISTRICT OFFICE</span>
            </div>
        </div>
        <div class="header-right">
            <div class="time-container">
                <span class="date-text" id="date-display">August 02, 2026</span>
                <span class="time-text" id="time-display">14:34:33</span>
            </div>
            <a href="index.html" class="admin-btn" id="home-button">HOME</a>
        </div>
    </header>

    <!-- Hero / Login Section -->
    <main class="hero" id="main-content">
        <!-- Faint Watermark Logo in Background -->
        <img src="assets/img/logo.png" alt="LTO Logo Watermark" class="hero-watermark">
        
        <div class="hero-content">
            <h1 class="hero-title">ADMIN SECTION</h1>
            
            <!-- Login Form Container -->
            <form class="login-form" id="login-form" onsubmit="event.preventDefault();">
                <!-- User Field -->
                <div class="input-group">
                    <input type="text" id="username" class="user-input" placeholder=" " required autocomplete="off">
                    <label for="username">USER</label>
                </div>
                
                <!-- Password Field -->
                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">PASSWORD</label>
                    <button type="button" class="toggle-password-btn" id="toggle-password-btn"
                            aria-label="Show password" aria-pressed="false">
                        <img src="assets/img/eye.png" alt="" aria-hidden="true" class="toggle-password-icon"
                             id="toggle-password-icon">
                    </button>
                </div>
                
                <!-- Login Button with Glass Texture -->
                <button type="submit" class="login-btn">LOGIN</button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js" defer></script>
    <script src="js/login.js" defer></script>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
</body>
</html>
