<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO Cabuyao District Office - Windows</title>
    <meta name="description"
        content="Land Transportation Office Cabuyao District Office Queuing System Window Selection">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <a class="skip-nav" href="#main-content">Skip to main content</a>

    <!-- Header Section -->
    <header class="header">
        <div class="header-left">
            <img src="img/logo.png" alt="LTO Logo" class="header-logo">
            <div class="header-title-container">
                <span class="header-title">LAND TRANSPORTATION OFFICE</span>
                <span class="header-subtitle">CABUYAO DISTRICT OFFICE</span>
            </div>
        </div>
        <div class="header-right">
            <div class="time-container">
                <span class="date-text" id="date-display">August 02, 2026</span>
                <span class="time-text" id="time-display">14:34</span>
            </div>
        </div>
    </header>

    <!-- Hero / Windows Section -->
    <main class="hero" id="main-content">
        <!-- Faint Watermark Logo in Background -->
        <img src="img/logo.png" alt="LTO Logo Watermark" class="hero-watermark">

        <div class="hero-content">
            <h1 class="hero-title">WINDOWS</h1>

            <!-- Grid containing 15 buttons -->
            <div class="windows-grid">
                <!-- Row 1: A to E -->
                <a href="windowA.html" class="window-btn btn-window">
                    <span class="window-btn-text">A</span>
                </a>
                <a href="windowB.html" class="window-btn btn-window">
                    <span class="window-btn-text">B</span>
                    <span class="window-badge" id="badge-windowB" role="status" aria-live="polite" aria-label="Queue count for Window B">0</span>
                </a>
                <a href="windowC.html" class="window-btn btn-window">
                    <span class="window-btn-text">C</span>
                    <span class="window-badge" id="badge-windowC" role="status" aria-live="polite" aria-label="Queue count for Window C">0</span>
                </a>
                <a href="windowD.html" class="window-btn btn-window">
                    <span class="window-btn-text">D</span>
                    <span class="window-badge" id="badge-windowD" role="status" aria-live="polite" aria-label="Queue count for Window D">0</span>
                </a>
                <a href="windowE.html" class="window-btn btn-window">
                    <span class="window-btn-text">E</span>
                    <span class="window-badge" id="badge-windowE" role="status" aria-live="polite" aria-label="Queue count for Window E">0</span>
                </a>

                <!-- Row 2: F to J -->
                <a href="windowF.html" class="window-btn btn-window">
                    <span class="window-btn-text">F</span>
                    <span class="window-badge" id="badge-windowF" role="status" aria-live="polite" aria-label="Queue count for Window F">0</span>
                </a>
                <a href="windowG.html" class="window-btn btn-window">
                    <span class="window-btn-text">G</span>
                    <span class="window-badge" id="badge-windowG" role="status" aria-live="polite" aria-label="Queue count for Window G">0</span>
                </a>
                <a href="windowH.html" class="window-btn btn-window">
                    <span class="window-btn-text">H</span>
                    <span class="window-badge" id="badge-windowH" role="status" aria-live="polite" aria-label="Queue count for Window H">0</span>
                </a>
                <a href="windowI.html" class="window-btn btn-window">
                    <span class="window-btn-text">I</span>
                    <span class="window-badge" id="badge-windowI" role="status" aria-live="polite" aria-label="Queue count for Window I">0</span>
                </a>
                <a href="windowJ.html" class="window-btn btn-window">
                    <span class="window-btn-text">J</span>
                    <span class="window-badge" id="badge-windowJ" role="status" aria-live="polite" aria-label="Queue count for Window J">0</span>
                </a>

                <!-- Row 3: M, N, Cashier, Control Panel -->
                <a href="windowM.html" class="window-btn btn-window">
                    <span class="window-btn-text">M</span>
                    <span class="window-badge" id="badge-windowM" role="status" aria-live="polite" aria-label="Queue count for Window M">0</span>
                </a>
                <a href="windowN.html" class="window-btn btn-window">
                    <span class="window-btn-text">N</span>
                    <span class="window-badge" id="badge-windowN" role="status" aria-live="polite" aria-label="Queue count for Window N">0</span>
                </a>
                <a href="cashier.html" class="window-btn btn-cashier btn-text-long">
                    <span class="window-btn-text">CASHIER</span>
                    <span class="window-badge" id="badge-cashier" role="status" aria-live="polite" aria-label="Queue count for Cashier">0</span>
                </a>
                <a href="controlPanel.html" class="window-btn btn-control-panel btn-text-long">
                    <span class="window-btn-text">CONTROL<br>PANEL</span>
                </a>
            </div>

            <!-- Logout Button with Glass Texture -->
            <a href="#" class="logout-btn" id="logout-button">LOG OUT</a>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        function isTicketInWindowSection(ticket, section) {
            if (!ticket) return false;
            var cur = ticket.currentSection;
            var purp = (ticket.purpose || '').toLowerCase();

            if (section === 'C_B') {
                return cur === 'C_B' || (!cur && purp === 'letas');
            }
            if (section === 'D_E') {
                return cur === 'D_E' || (!cur && (purp === 'miscellaneous' || purp === 'misc'));
            }
            if (section === 'E_J') {
                return cur === 'E_J' || (!cur && (purp === 'renewal' || purp === 'other'));
            }
            if (section === 'D_E_or_E_J') {
                return cur === 'D_E' || cur === 'E_J' || (!cur && (purp === 'miscellaneous' || purp === 'misc' || purp === 'renewal' || purp === 'other'));
            }
            if (section === 'Cashier') {
                return cur === 'Cashier';
            }
            if (section === 'M_N') {
                return cur === 'M_N';
            }
            return false;
        }

        function updateBadges() {
            var raw = JSON.parse(localStorage.getItem('lto_ticket_queue') || '[]');

            var counts = {
                'windowB': 0, 'windowC': 0,
                'windowD': 0, 'windowE': 0,
                'windowF': 0, 'windowG': 0, 'windowH': 0, 'windowI': 0, 'windowJ': 0,
                'windowM': 0, 'windowN': 0,
                'cashier': 0
            };

            raw.forEach(function (ticket) {
                if (isTicketInWindowSection(ticket, 'C_B')) {
                    counts['windowB']++;
                    counts['windowC']++;
                }
                if (isTicketInWindowSection(ticket, 'D_E')) {
                    counts['windowD']++;
                    counts['windowE']++;
                }
                if (isTicketInWindowSection(ticket, 'E_J')) {
                    counts['windowE']++;
                    counts['windowF']++;
                    counts['windowG']++;
                    counts['windowH']++;
                    counts['windowI']++;
                    counts['windowJ']++;
                }
                if (isTicketInWindowSection(ticket, 'Cashier')) {
                    counts['cashier']++;
                }
                if (isTicketInWindowSection(ticket, 'M_N')) {
                    counts['windowM']++;
                    counts['windowN']++;
                }
            });

            for (var wId in counts) {
                var badgeEl = document.getElementById('badge-' + wId);
                if (badgeEl) {
                    var count = counts[wId];
                    badgeEl.textContent = count;
                    if (count > 0) {
                        badgeEl.style.display = 'flex';
                    } else {
                        badgeEl.style.display = 'none';
                    }
                }
            }
        }

        updateBadges();
        setInterval(updateBadges, 1000);
        // Live Clock script (Philippine Standard Time UTC+8 / Asia/Manila)
        function updateClock() {
            try {
                const now = new Date();

                // Format date in Manila timezone
                const dateOptions = {
                    timeZone: 'Asia/Manila',
                    month: 'long',
                    day: '2-digit',
                    year: 'numeric'
                };
                const dateStr = now.toLocaleDateString('en-US', dateOptions);

                // Format time in Manila timezone (military / 24-hour style)
                const timeOptions = {
                    timeZone: 'Asia/Manila',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit', // Showing seconds in window list matches visual feedback of clock live updating
                    hour12: false
                };
                let timeStr = now.toLocaleTimeString('en-US', timeOptions);

                // Clean up non-numeric letters (e.g. AM/PM check)
                timeStr = timeStr.replace(/\s*[a-zA-Z]+/g, '');

                // Update elements
                document.getElementById('date-display').textContent = dateStr;
                document.getElementById('time-display').textContent = timeStr;
            } catch (e) {
                console.error("Error updating Philippine Time: ", e);
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Logout Event handler & Toast notification
        const logoutButton = document.getElementById('logout-button');
        logoutButton.addEventListener('click', function (event) {
            event.preventDefault();
            showToast("Successfully logged out! Redirecting...", "logout", function () {
                window.location.href = 'index.html';
            });
        });

        function showToast(message, type, callback) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            // Trigger animation
            setTimeout(() => {
                toast.classList.add('show');
            }, 50);

            // Hide and execute callback
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                    if (callback) callback();
                }, 300);
            }, 1500);
        }
    </script>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
</body>

</html>
